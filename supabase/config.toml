# Project-local configuration only. Not linked to a hosted project.
project_id = "huong-do-tasks"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false
enable_anonymous_sign_ins = false

[storage]
enabled = true
file_size_limit = "10MiB"
